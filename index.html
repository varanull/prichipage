<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para Pris</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Karla:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --noche:#120F2A; --flor:#F4C63D; --petalo:#FFE486;
    --tallo:#5E7F4A; --texto:#EDE6FF;
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--noche); color:var(--texto);
    font-family:"Karla",system-ui,-apple-system,"Segoe UI",sans-serif;
    overflow:hidden; position:relative;
    -webkit-tap-highlight-color:transparent;
  }

  /* cielo */
  .cielo{position:fixed;inset:0;z-index:0;}
  .cielo.noche{background:linear-gradient(180deg,#120F2A 0%,#1E1846 58%,#2A2154 100%);}
  .cielo.alba{background:linear-gradient(180deg,#241C4D 0%,#4A2E63 42%,#8F5670 72%,#E0A45C 100%);
    opacity:0;transition:opacity 4s ease;}
  body.florecido .cielo.alba{opacity:1;}

  .estrella{position:fixed;width:2px;height:2px;border-radius:50%;background:#fff;z-index:1;
    animation:titilar 4s ease-in-out infinite;transition:opacity 3s ease;}
  body.florecido .estrella{opacity:0 !important;}
  @keyframes titilar{0%,100%{opacity:.15}50%{opacity:.7}}

  /* corazon */
  .corazon{
    position:fixed;z-index:8;left:0;right:0;
    top:calc(env(safe-area-inset-top,0px) + 1.1rem);
    text-align:center;font-size:1.35rem;color:var(--flor);
    letter-spacing:.06em;
    text-shadow:0 2px 18px rgba(18,15,42,.75);
    animation:latir 2.6s ease-in-out infinite;
  }
  @keyframes latir{0%,100%{transform:scale(1)}14%{transform:scale(1.16)}28%{transform:scale(1)}42%{transform:scale(1.1)}}

  /* nota inicial */
  .nota{
    position:relative;z-index:7;min-height:100%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.6rem;
    padding:calc(env(safe-area-inset-top,0px) + 2rem) 1.6rem calc(env(safe-area-inset-bottom,0px) + 2rem);
    text-align:center;transition:opacity 1.1s ease, transform 1.1s ease;
  }
  body.florecido .nota{opacity:0;transform:translateY(-14px);pointer-events:none;}
  .nota p{
    font-family:"Fraunces",Georgia,serif;font-weight:300;
    font-size:clamp(1.55rem,5.6vw,2.5rem);line-height:1.4;letter-spacing:-0.012em;
    max-width:19ch;margin:0;opacity:0;
    animation:entrar 1.8s cubic-bezier(.2,.7,.3,1) .35s forwards;
  }
  @keyframes entrar{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .boton{
    font-family:"Karla",sans-serif;font-size:1rem;font-weight:500;letter-spacing:.02em;
    color:var(--flor);background:transparent;
    border:1px solid rgba(244,198,61,.55);border-radius:999px;padding:.8rem 2.4rem;cursor:pointer;
    opacity:0;animation:entrar 1.4s ease 2.1s forwards;
    transition:background-color .35s ease,color .35s ease,border-color .35s ease;
  }
  .boton:hover{background:var(--flor);color:#221A12;border-color:var(--flor);}
  .boton:focus-visible{outline:2px solid var(--petalo);outline-offset:4px;}

  /* letra */
  .letra{
    position:fixed;z-index:6;left:0;right:0;
    top:calc(env(safe-area-inset-top,0px) + 3.4rem);
    padding:0 1.5rem;text-align:center;
    opacity:0;transition:opacity 1.6s ease;
    pointer-events:none;
  }
  body.florecido .letra{opacity:1;transition-delay:2.2s;}
  .letra span{
    display:inline-block;
    font-family:"Fraunces",Georgia,serif;font-weight:300;
    font-size:clamp(1.15rem,4.2vw,1.75rem);line-height:1.4;
    max-width:22ch;
    text-shadow:0 2px 22px rgba(18,15,42,.8);
    transition:opacity .7s ease, transform .7s ease;
  }
  .letra span.saliendo{opacity:0;transform:translateY(-8px);}

  /* fotos */
  .fotos{
    position:fixed;inset:0;z-index:5;pointer-events:none;
    display:flex;flex-wrap:wrap;align-content:center;align-items:center;justify-content:center;
    gap:clamp(8px,2.2vw,18px);
    padding:calc(env(safe-area-inset-top,0px) + 7.5rem) 4vw calc(env(safe-area-inset-bottom,0px) + 4.5rem);
  }
  .foto{
    flex:0 0 auto;
    background:#F7F3EA;padding:7px 7px 26px;
    border-radius:3px;
    box-shadow:0 16px 40px rgba(10,6,28,.55), 0 2px 6px rgba(10,6,28,.4);
    opacity:0;
    transform:rotate(var(--rot)) scale(.82) translateY(10px);
    transition:opacity .7s ease, transform .7s cubic-bezier(.2,1.25,.4,1), width .55s ease;
  }
  .foto.visible{opacity:1;transform:rotate(var(--rot)) scale(1) translateY(0);}
  .foto img{display:block;width:100%;height:auto;border-radius:1px;}

  /* pista */
  .pista{
    position:fixed;z-index:7;left:0;right:0;
    bottom:calc(env(safe-area-inset-bottom,0px) + 1.1rem);
    text-align:center;font-size:.78rem;letter-spacing:.05em;
    color:rgba(237,230,255,.72);
    text-shadow:0 2px 14px rgba(18,15,42,.9);
    opacity:0;transition:opacity 1.2s ease;
  }
  body.florecido .pista{opacity:1;transition-delay:3.4s;}

  /* campo */
  .campo{position:fixed;inset:0;z-index:4;pointer-events:none;overflow:hidden;}
  .mecer{position:absolute;bottom:-2px;transform-origin:bottom center;}
  body.florecido .mecer{animation:mecer var(--sway) ease-in-out infinite alternate;animation-delay:var(--d);}
  @keyframes mecer{from{transform:rotate(-2.2deg)}to{transform:rotate(2.2deg)}}
  .tallo{position:relative;width:2.5px;height:0;
    background:linear-gradient(180deg,var(--tallo),#3C5A31);border-radius:2px;
    transition:height 1.5s cubic-bezier(.17,.78,.36,1);transition-delay:var(--d);}
  .cabeza{position:absolute;top:0;left:50%;
    transform:translate(-50%,-50%) scale(0) rotate(var(--r));
    transition:transform .7s cubic-bezier(.3,1.5,.5,1);transition-delay:calc(var(--d) + .95s);}

  @media (max-width:620px){
    .foto{padding:5px 5px 18px;}
    .fotos{padding-top:calc(env(safe-area-inset-top,0px) + 6.5rem);}
  }
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;}
    .nota p,.boton{opacity:1;}
    .tallo,.cabeza,.foto{transition-duration:.01s;}
  }
</style>
</head>
<body>

<div class="cielo noche"></div>
<div class="cielo alba"></div>
<div class="campo" id="campo"></div>
<div class="fotos" id="fotos"></div>

<div class="corazon">&lt;3</div>
<div class="letra" id="letra"><span id="linea"></span></div>

<div class="nota" id="nota">
  <p>Hola Pris, s&eacute; que estoy lejos pero no quer&iacute;a que te quedaras sin esto</p>
  <button class="boton" id="boton">Continuar</button>
</div>

<div class="pista" id="pista">Toca la pantalla</div>

(function(){
  var campo = document.getElementById('campo');
  var boton = document.getElementById('boton');
  var cajaFotos = document.getElementById('fotos');
  var linea = document.getElementById('linea');
  var pista = document.getElementById('pista');
  var cancion = document.getElementById('cancion');
  var angosto = window.innerWidth < 620;

  for (var i = 0; i < 34; i++){
    var e = document.createElement('div');
    e.className = 'estrella';
    e.style.left = (Math.random()*100) + '%';
    e.style.top = (Math.random()*62) + '%';
    e.style.animationDelay = (Math.random()*4) + 's';
    document.body.appendChild(e);
  }

  function florSVG(tam){
    var petalos = 5 + Math.round(Math.random());
    var tono = 42 + Math.random()*10;
    var claro = 58 + Math.random()*12;
    var svg = '<svg width="'+tam+'" height="'+tam+'" viewBox="-50 -50 100 100" aria-hidden="true">';
    for (var p = 0; p < petalos; p++){
      svg += '<ellipse cx="0" cy="-26" rx="13" ry="23" transform="rotate('+((360/petalos)*p)+')" fill="hsl('+tono+',88%,'+claro+'%)" opacity="0.95"/>';
    }
    return svg + '<circle r="11" fill="#B9741A"/><circle r="6" fill="#8C5410" opacity=".55"/></svg>';
  }

  function plantar(izq, alturaVh, retraso, tam){
    var mecer = document.createElement('div');
    mecer.className = 'mecer';
    mecer.style.left = izq + '%';
    mecer.style.setProperty('--sway', (2.8 + Math.random()*2.6).toFixed(2) + 's');
    mecer.style.setProperty('--d', retraso.toFixed(2) + 's');
    var tallo = document.createElement('div');
    tallo.className = 'tallo';
    tallo.style.setProperty('--d', retraso.toFixed(2) + 's');
    var cabeza = document.createElement('div');
    cabeza.className = 'cabeza';
    var rot = (Math.random()*60 - 30).toFixed(1) + 'deg';
    cabeza.style.setProperty('--d', retraso.toFixed(2) + 's');
    cabeza.style.setProperty('--r', rot);
    cabeza.innerHTML = florSVG(tam);
    tallo.appendChild(cabeza);
    mecer.appendChild(tallo);
    campo.appendChild(mecer);
    void tallo.offsetHeight;
    tallo.style.height = alturaVh + 'vh';
    cabeza.style.transform = 'translate(-50%,-50%) scale(1) rotate(' + rot + ')';
  }

  function sembrar(){
    var total = angosto ? 34 : 56;
    for (var i = 0; i < total; i++){
      var fondo = Math.random() < 0.45;
      plantar(Math.random()*102 - 1,
              fondo ? (14 + Math.random()*22) : (26 + Math.random()*46),
              Math.random()*1.5,
              fondo ? (26 + Math.random()*14) : (40 + Math.random()*30));
    }
  }

  /* ---- fotos ---- */
  var siguiente = 0;

  /* reparte el espacio: entre mas fotos haya, mas chicas se hacen,
     para que todas queden visibles al mismo tiempo */
  function acomodar(){
    var n = cajaFotos.children.length;
    var movil = window.innerWidth < 620;
    var anchos = movil
      ? ['', '58vw', '44vw', '40vw', '36vw', '30vw']
      : ['', '260px', '230px', '200px', '185px', '170px'];
    var w = anchos[Math.min(n, 5)];
    for (var i = 0; i < cajaFotos.children.length; i++){
      cajaFotos.children[i].style.width = w;
    }
  }
  window.addEventListener('resize', acomodar);

  function mostrarFoto(){
    if (siguiente >= FOTOS.length){
      pista.textContent = 'Te Amo Prichi';
      return;
    }
    var d = document.createElement('div');
    d.className = 'foto';
    d.style.setProperty('--rot', (Math.random()*7 - 3.5).toFixed(1) + 'deg');
    var img = document.createElement('img');
    img.src = FOTOS[siguiente];
    img.alt = '';
    d.appendChild(img);
    cajaFotos.appendChild(d);
    void d.offsetHeight;
    d.classList.add('visible');
    siguiente++;
    acomodar();
    pista.textContent = siguiente >= FOTOS.length ? 'Te Amo Prichi' : 'Toca otra vez';
  }

  /* ---- letra sincronizada ---- */
  var arranque = 0, indiceLetra = -1;
  function segundos(){
    if (cancion && !isNaN(cancion.currentTime) && cancion.currentTime > 0) return cancion.currentTime;
    return (Date.now() - arranque) / 1000;
  }
  function pintarLetra(){
    var s = segundos(), i = 0;
    for (var k = 0; k < LETRA.length; k++){ if (s >= LETRA[k].t) i = k; }
    if (i !== indiceLetra){
      indiceLetra = i;
      linea.classList.add('saliendo');
      setTimeout(function(){
        linea.innerHTML = LETRA[indiceLetra].texto;
        linea.classList.remove('saliendo');
      }, 450);
    }
    requestAnimationFrame(pintarLetra);
  }

  boton.addEventListener('click', function(){
    document.body.classList.add('florecido');
    sembrar();
    arranque = Date.now();
    if (cancion){
      var p = cancion.play();
      if (p && p.catch) p.catch(function(){});
    }
    requestAnimationFrame(pintarLetra);
  });

  document.body.addEventListener('click', function(ev){
    if (!document.body.classList.contains('florecido')) return;
    if (ev.target === boton) return;
    mostrarFoto();
  });
})();
</script>
